<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GENCARE - Patients</title>
  <link rel="icon" type="image/png" href="../../assets/logo/LogoSmall.png">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-sky-100 to-white min-h-screen font-poppins">
  
  <!-- Fixed Left Sidebar -->
  <div class="flex flex-col fixed left-0 top-0 h-full w-64 bg-gradient-to-b from-sky-700 via-sky-600 to-sky-800 shadow-xl z-50">
    <!-- Logo Section -->
    <div class="px-6 py-3 border-b border-sky-500/30">
      <div class="flex items-center gap-3">
        <img src="../../assets/logo/LogoSmall.png" alt="Logo" class="h-12 w-12 object-contain">
        <h1 class="text-xl font-bold text-white">GENCARE</h1>
      </div>
    </div>
    
    <div>
    <!-- Navigation Links -->
    <nav class="flex flex-col px-4">
      <div onclick="window.location.href=`../dashboard/adminDashboard.html`" class="px-4 py-3 text-sky-100 rounded-xl hover:bg-white/20 hover:text-white hover:shadow-md transition-all duration-300 cursor-pointer font-medium flex items-center gap-3">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2-2z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5v4"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 5v4"></path>
        </svg>
        Dashboard
      </div>

      <div onclick="window.location.href=`../doctors/adminDoctors.html`" class="px-4 py-3 text-sky-100 rounded-xl hover:bg-white/20 hover:text-white hover:shadow-md transition-all duration-300 cursor-pointer font-medium flex items-center gap-3">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <!-- Earpieces -->
            <circle cx="6" cy="4" r="2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="18" cy="4" r="2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Tubes -->
            <path d="M6 6v5a6 4 0 0012 0V6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Tube going down -->
            <path d="M12 17v2a3 3 0 006 0v-2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Chest piece -->
            <circle cx="18" cy="19" r="2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        Doctors
      </div>
      
      <div class="px-4 py-3 bg-white/20 text-white rounded-xl shadow-md backdrop-blur-sm font-medium flex items-center gap-3 cursor-pointer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
        </svg>
        Patients
      </div>
      
      <div onclick="window.location.href=`../contentManagement/adminContent.html`" class="px-4 py-3 text-sky-100 rounded-xl hover:bg-white/20 hover:text-white hover:shadow-md transition-all duration-300 cursor-pointer font-medium flex items-center gap-3">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
        Content Management
      </div>
      
      <div onclick="window.location.href=`../report/adminReport.html`" class="px-4 py-3 text-sky-100 rounded-xl hover:bg-white/20 hover:text-white hover:shadow-md transition-all duration-300 cursor-pointer font-medium flex items-center gap-3">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
        </svg>
        Reports
      </div>
      
      <div onclick="window.location.href=`../backupRecovery/adminBackup.html`" class="px-4 py-3 text-sky-100 rounded-xl hover:bg-white/20 hover:text-white hover:shadow-md transition-all duration-300 cursor-pointer font-medium flex items-center gap-3">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4"></path>
        </svg>
        Backup & Recovery
      </div>
      
      <div onclick="window.location.href=`../Queries/adminQueries.html`" class="px-4 py-3 text-sky-100 rounded-xl hover:bg-white/20 hover:text-white hover:shadow-md transition-all duration-300 cursor-pointer font-medium flex items-center gap-3">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        Queries
      </div>
    </nav>
  </div>
    
    <!-- Profile Section at Bottom -->
    <div class="absolute bottom-0 left-0 right-0 p-4 border-sky-500/30">
      <button class="flex gap-1 text-sky-100 items-center w-full px-6 py-2 rounded-xl hover:bg_white/20 hover:text-white hover:bg-white/20 my-2 hover:shadow-md transition-all duration-300 cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        Help
      </button>
      <div class="relative">
        <div id="profileButton" class="w-full flex items-center gap-3 p-3 bg-white/20 rounded-xl backdrop-blur-sm cursor-pointer hover:bg-white/30 transition-all duration-300">
          <div class="w-10 h-10 bg-gradient-to-br from-gray-300 to-gray-400 rounded-full flex items-center justify-center">
            <img src="../../assets/images/profile.png" class="w-6 h-6" alt="Profile">
          </div>
          <div class="text-white font-medium">Admin</div>
          <svg class="w-4 h-4 text-white ml-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
        </div>
        
        <div id="profileDropdown" class="hidden absolute bottom-16 left-0 right-0 bg-white rounded-xl shadow-lg border border-gray-100 py-2 z-50">
          <button onclick="window.location.href=`../profile/adminProfile.html`" class="w-full px-4 py-2 text-left text-gray-800 hover:bg-gray-50 transition-colors duration-200 flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
            Profile
          </button>
          <button onclick="logout()" class="w-full px-4 py-2 text-left text-red-600 hover:bg-red-50 transition-colors duration-200 flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
            </svg>
            Logout
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content Area (shifted right to accommodate sidebar) -->
  <div class="ml-64">
    <!-- Header -->
    <section class="p-8 pt-6">
      <div class="mb-8 flex justify-between items-center">
        <div>
          <h1 class="text-4xl font-bold text-gray-800 mb-2">Patient Appointments</h1>
          <p class="text-gray-600">Manage and track all patient appointments</p>
        </div>
      </div>

      <!-- Search and Filter Section -->
      <div class="mb-6 bg-white/50 backdrop-blur-md border border-white/20 rounded-2xl shadow-lg p-6">
        <div class="flex flex-col md:flex-row gap-4 items-end">
          <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 mb-2">Search Appointments</label>
            <input 
              type="text" 
              id="searchInput" 
              placeholder="Search by patient name, ID, or doctor..." 
              class="w-full px-4 py-3 border border-gray-300 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition-all duration-300"
            >
          </div>
          <div class="min-w-48">
            <label class="block text-sm font-medium text-gray-700 mb-2">Status</label>
            <select 
              id="statusFilter" 
              class="w-full px-4 py-3 border border-gray-300 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition-all duration-300"
            >
              <option value="">All Status</option>
              <option value="visited">Visited</option>
              <option value="scheduled">Scheduled</option>
              <option value="rescheduled">Rescheduled</option>
              <option value="canceled">Canceled</option>
            </select>
          </div>
          <div class="min-w-36">
            <label class="block text-sm font-medium text-gray-700 mb-2">Date</label>
            <input 
              type="date" 
              id="dateFilter" 
              class="w-full px-4 py-3 border border-gray-300 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition-all duration-300"
            >
          </div>
          <button 
            onclick="clearFilters()" 
            class="px-6 py-3 bg-gray-100 text-gray-700 rounded-xl hover:bg-gray-200 transition-all duration-300 flex items-center gap-2"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
            Clear
          </button>
        </div>
      </div>

      <!-- Patients Table -->
      <div class="bg-white/50 backdrop-blur-md border border-white/20 rounded-2xl shadow-lg overflow-hidden">
        <div class="overflow-x-auto">
          <table class="min-w-full text-left text-sm text-gray-800">
            <thead class="bg-gradient-to-r from-sky-600 to-sky-700 text-white">
              <tr>
                <th class="px-6 py-4 font-semibold">Appointment ID</th>
                <th class="px-6 py-4 font-semibold">Patient ID</th>
                <th class="px-6 py-4 font-semibold">Patient Name</th>
                <th class="px-6 py-4 font-semibold">Doctor Name</th>
                <th class="px-6 py-4 font-semibold">Date</th>
                <th class="px-6 py-4 font-semibold">Time</th>
                <th class="px-6 py-4 font-semibold">Status</th>
                <th class="px-6 py-4 font-semibold text-center">Actions</th>
              </tr>
            </thead>
            <tbody id="patientTable" class="divide-y divide-gray-100">
              <!-- Table rows will be populated by JavaScript -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- Pagination -->
      <div class="flex flex-col md:flex-row justify-between items-center mt-6 gap-4">
        <div id="recordInfo" class="text-gray-600 text-sm font-medium"></div>
        <div class="flex gap-2">
          <button 
            id="prevBtn" 
            class="px-4 py-2 bg-sky-600 text-white rounded-xl hover:bg-sky-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-300 flex items-center gap-2"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
            Previous
          </button>
          <button 
            id="nextBtn" 
            class="px-4 py-2 bg-sky-600 text-white rounded-xl hover:bg-sky-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-300 flex items-center gap-2"
          >
            Next
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
          </button>
        </div>
      </div>
    </section>
  </div>

  <script>
    function logout(){
      const confirmed = confirm("Are you sure you want to log out?");
      if(confirmed){
        window.location.href="../../../index.html"
      }
    }
    // Load real data from localStorage
    const appointments = JSON.parse(localStorage.getItem('appointments')) || [];
    const doctors = JSON.parse(localStorage.getItem('doctors')) || [];
    const patientsMaster = JSON.parse(localStorage.getItem('patients')) || [];

    // Normalize into rows for table
    const patients = appointments.map(appt => {
      const doc = doctors.find(d => d.doctorId === appt.doctorId);
      const pat = patientsMaster.find(p => p.patientId === appt.patientId);
      return {
        apptId: appt.appointmentId,
        patientId: appt.patientId,
        name: pat ? pat.patientName : appt.patientId,
        doctor: doc ? doc.doctorName : appt.doctorId,
        date: appt.date.split('/').reverse().join('-'), // to YYYY-MM-DD for input filter
        time: appt.time,
        status: appt.status === 'confirmed' ? 'scheduled' : appt.status
      };
    });

    let filteredPatients = [...patients];
    const rowsPerPage = 10;
    let currentPage = 1;

    function getStatusBadge(status) {
      const statusMap = {
        visited: { class: "bg-green-100 text-green-800", text: "Visited" },
        scheduled: { class: "bg-blue-100 text-blue-800", text: "Scheduled" },
        rescheduled: { class: "bg-yellow-100 text-yellow-800", text: "Rescheduled" },
        canceled: { class: "bg-red-100 text-red-800", text: "Canceled" }
      };
      
      const config = statusMap[status] || { class: "bg-gray-100 text-gray-800", text: "Unknown" };
      return `<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium ${config.class}">${config.text}</span>`;
    }

    function formatDate(dateStr) {
      // dateStr in YYYY-MM-DD
      const [y,m,d] = dateStr.split('-');
      return `${d}/${m}/${y}`;
    }

    function renderTable() {
      const tableBody = document.getElementById("patientTable");
      tableBody.innerHTML = "";

      const start = (currentPage - 1) * rowsPerPage;
      const end = start + rowsPerPage;
      const pageData = filteredPatients.slice(start, end);

      pageData.forEach((pt, index) => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-sky-50 transition-colors duration-300";
        tr.innerHTML = `
          <td class="px-6 py-4 font-medium text-sky-700">${pt.apptId}</td>
          <td class="px-6 py-4 font-medium text-gray-600">${pt.patientId}</td>
          <td class="px-6 py-4 font-medium">${pt.name}</td>
          <td class="px-6 py-4 text-gray-600">${pt.doctor}</td>
          <td class="px-6 py-4">${formatDate(pt.date)}</td>
          <td class="px-6 py-4 font-medium">${pt.time}</td>
          <td class="px-6 py-4">${getStatusBadge(pt.status)}</td>
          <td class="px-6 py-4">
            <div class="flex justify-center gap-2">
              <button class="p-2 bg-sky-100 text-sky-600 rounded-lg hover:bg-sky-200 transition-colors duration-200" title="View Details">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                </svg>
              </button>
              <button class="p-2 bg-green-100 text-green-600 rounded-lg hover:bg-green-200 transition-colors duration-200" title="Send Message">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 4.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                </svg>
              </button>
              <button class="p-2 bg-amber-100 text-amber-600 rounded-lg hover:bg-amber-200 transition-colors duration-200" title="Reschedule">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
              </button>
            </div>
          </td>
        `;
        tableBody.appendChild(tr);
      });

      updatePagination();
    }

    function updatePagination() {
      const start = (currentPage - 1) * rowsPerPage;
      const end = Math.min(start + rowsPerPage, filteredPatients.length);
      
      document.getElementById("recordInfo").textContent =
        `Showing ${start + 1}–${end} of ${filteredPatients.length} appointments`;
      
      document.getElementById("prevBtn").disabled = currentPage === 1;
      document.getElementById("nextBtn").disabled = end >= filteredPatients.length;
    }

    function filterPatients() {
      const searchTerm = document.getElementById("searchInput").value.toLowerCase();
      const statusFilter = document.getElementById("statusFilter").value;
      const dateFilter = document.getElementById("dateFilter").value;

      filteredPatients = patients.filter(patient => {
        const matchesSearch = !searchTerm || 
          patient.name.toLowerCase().includes(searchTerm) ||
          patient.patientId.toLowerCase().includes(searchTerm) ||
          patient.apptId.toLowerCase().includes(searchTerm) ||
          patient.doctor.toLowerCase().includes(searchTerm);
        
        const matchesStatus = !statusFilter || patient.status === statusFilter;
        const matchesDate = !dateFilter || patient.date === dateFilter;

        return matchesSearch && matchesStatus && matchesDate;
      });

      currentPage = 1;
      renderTable();
    }

    function clearFilters() {
      document.getElementById("searchInput").value = "";
      document.getElementById("statusFilter").value = "";
      document.getElementById("dateFilter").value = "";
      filteredPatients = [...patients];
      currentPage = 1;
      renderTable();
    }

    // Event Listeners
    document.getElementById("searchInput").addEventListener("input", filterPatients);
    document.getElementById("statusFilter").addEventListener("change", filterPatients);
    document.getElementById("dateFilter").addEventListener("change", filterPatients);

    document.getElementById("prevBtn").addEventListener("click", () => {
      if (currentPage > 1) {
        currentPage--;
        renderTable();
      }
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      if ((currentPage * rowsPerPage) < filteredPatients.length) {
        currentPage++;
        renderTable();
      }
    });

    // Profile dropdown functionality
    document.addEventListener("DOMContentLoaded", () => {
      const profileBtn = document.getElementById("profileButton");
      const dropdown = document.getElementById("profileDropdown");

      profileBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        dropdown.classList.toggle("hidden");
      });

      // Close dropdown when clicking anywhere else
      document.addEventListener("click", () => {
        if (!dropdown.classList.contains("hidden")) {
          dropdown.classList.add("hidden");
        }
      });
    });

    // Initialize table
    renderTable();
  </script>
</body>
</html>
