<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GENCARE - appointments</title>
  <link rel="icon" type="image/png" href="../../assets/logo/LogoSmall.png">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-sky-100 to-white min-h-screen font-poppins">
  <!-- Fixed Left Sidebar -->
  <div class="flex flex-col fixed left-0 top-0 h-full w-64 bg-gradient-to-b from-sky-700 via-sky-600 to-sky-800 shadow-xl z-50">
    <!-- Logo Section -->
    <div class="px-6 py-3 border-b border-sky-500/30">
      <div class="flex items-center gap-3">
        <img src="../../assets/logo/LogoSmall.png" alt="Logo" class="h-12 w-12 object-contain">
        <h1 class="text-xl font-bold text-white">GENCARE</h1>
      </div>
    </div>

    <!-- Navigation Links -->
    <nav class="flex flex-col px-4 mt-1">
      <div onclick="window.location.href=`../dashboard/patientDashboard.html`" class="px-4 py-3 text-sky-100 rounded-xl hover:bg-white/20 hover:text-white hover:shadow-md transition-all duration-300 cursor-pointer font-medium flex items-center gap-3">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2-2z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5v4"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 5v4"></path>
        </svg>
        Dashboard
      </div>

      <div onclick="window.location.href=`./patientAppointment.html`" class="px-4 py-3 text-sky-100 rounded-xl hover:bg-white/20 hover:text-white hover:shadow-md transition-all duration-300 cursor-pointer font-medium flex items-center gap-3">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
        </svg>
        Book Appointment
      </div>

      <div class="px-4 py-3 bg-white/20 text-white rounded-xl shadow-md backdrop-blur-sm font-medium flex items-center gap-3 cursor-pointer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
        </svg>
        My Bookings
      </div>

      <div onclick="window.location.href=`../report/patientReport.html`" class="px-4 py-3 text-sky-100 rounded-xl hover:bg-white/20 hover:text-white hover:shadow-md transition-all duration-300 cursor-pointer font-medium flex items-center gap-3">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6a2 2 0 012-2h6m2 2v13a2 2 0 01-2 2H9m0 0H7a2 2 0 01-2-2V9"></path>
        </svg>
        Reports
      </div>

      <div onclick="window.location.href=`../reviews/patientReview.html`" class="px-4 py-3 text-sky-100 rounded-xl hover:bg-white/20 hover:text-white hover:shadow-md transition-all duration-300 cursor-pointer font-medium flex items-center gap-3">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292A1 1 0 0015.97 7.91h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L4.98 9.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path>
        </svg>
        Reviews
      </div>
    </nav>

    <!-- Profile Section at Bottom -->
    <div class="absolute bottom-0 left-0 right-0 p-4 border-sky-500/30">
        <button class="flex gap-1 text-sky-100 items-center w-full px-6 py-2 rounded-xl hover:bg_white/20 hover:text-white hover:bg-white/20 my-2 hover:shadow-md transition-all duration-300 cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          Help
        </button>
        <div class="relative">
          <div id="profileButton" class="w-full flex items-center gap-3 p-3 bg-white/20 rounded-xl backdrop-blur-sm cursor-pointer hover:bg-white/30 transition-all duration-300">
            <div class="w-10 h-10 bg-gradient-to-br from-gray-300 to-gray-400 rounded-full flex items-center justify-center">
              <img src="../../assets/images/profile.png" class="w-6 h-6" alt="Profile">
            </div>
            <div class="text-white font-medium">Patient</div>
            <svg class="w-4 h-4 text-white ml-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </div>
  
          <div id="profileDropdown" class="hidden absolute bottom-16 left-0 right-0 bg-white rounded-xl shadow-lg border border-gray-100 py-2 z-50">
            <button onclick="window.location.href='../profile/patientProfile.html'" class="w-full px-4 py-2 text-left text-gray-800 hover:bg-gray-50 transition-colors duration-200 flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
              Profile
            </button>
            <button onclick="logout()" class="w-full px-4 py-2 text-left text-red-600 hover:bg-red-50 transition-colors duration-200 flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
              </svg>
              Logout
            </button>
          </div>
        </div>
      </div>
  </div>

  <!-- Main Content Area (shifted right to accommodate sidebar) -->
  <div class="ml-64">
    <section class="p-8 pt-6">
      <div class="mb-8 flex justify-between items-center">
        <div>
          <h1 class="text-4xl font-bold text-gray-800 mb-2">My Bookings</h1>
          <p class="text-gray-600">Manage your scheduled appointments and view history</p>
        </div>
      </div>

      <!-- Tab Navigation -->
      <div class="mb-6 bg-white/50 backdrop-blur-md border border-white/20 rounded-2xl shadow-lg p-2">
        <div class="flex space-x-1">
          <button id="scheduledTab" class="flex-1 px-6 py-3 text-sm font-medium rounded-xl transition-all duration-300 bg-sky-600 text-white shadow-md">
            <div class="flex items-center justify-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
              </svg>
              Scheduled
            </div>
          </button>
          <button id="historyTab" class="flex-1 px-6 py-3 text-sm font-medium rounded-xl transition-all duration-300 text-gray-600 hover:bg-white/50 hover:text-gray-800">
            <div class="flex items-center justify-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
              </svg>
              History
            </div>
          </button>
        </div>
      </div>

      <!-- Scheduled Content -->
      <div id="scheduledContent" class="tab-content">
        <div id="scheduledList" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
      </div>

      <!-- History Content -->
      <div id="historyContent" class="tab-content hidden">
        <!-- Search and Filter Section -->
        <div class="mb-6 bg-white/50 backdrop-blur-md border border-white/20 rounded-2xl shadow-lg p-6">
          <div class="flex flex-col md:flex-row gap-4 items-end">
            <div class="flex-1">
              <label class="block text-sm font-medium text-gray-700 mb-2">Search Appointments</label>
              <input type="text" id="searchInput" placeholder="Search by doctor, dept, or ID..." class="w-full px-4 py-3 border border-gray-300 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition-all duration-300">
            </div>
            <div class="min-w-48">
              <label class="block text-sm font-medium text-gray-700 mb-2">Department</label>
              <select id="departmentFilter" class="w-full px-4 py-3 border border-gray-300 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition-all duration-300">
                <option value="">All Departments</option>
                <option value="Cardiology">Cardiology</option>
                <option value="Neurology">Neurology</option>
                <option value="Orthopedics">Orthopedics</option>
                <option value="ENT">ENT</option>
              </select>
            </div>
            <button onclick="clearFilters()" class="px-6 py-3 bg-gray-100 text-gray-700 rounded-xl hover:bg-gray-200 transition-all duration-300 flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
              </svg>
              Clear
            </button>
          </div>
        </div>

        <!-- History Table -->
        <div class="bg-white/50 backdrop-blur-md border border-white/20 rounded-2xl shadow-lg overflow-hidden">
          <div class="overflow-x-auto">
            <table class="min-w-full text-left text-sm text-gray-800">
              <thead class="bg-gradient-to-r from-sky-600 to-sky-700 text-white">
                <tr>
                  <th class="px-2 py-4 font-semibold">Appointment ID</th>
                  <th class="px-6 py-4 font-semibold">Doctor</th>
                  <th class="px-6 py-4 font-semibold">Department</th>
                  <th class="px-6 py-4 font-semibold">Date</th>
                  <th class="px-6 py-4 font-semibold">Time</th>
                  <th class="px-6 py-4 font-semibold text-center">Actions</th>
                </tr>
              </thead>
              <tbody id="historyTable" class="divide-y divide-gray-100"></tbody>
            </table>
          </div>
        </div>

        <!-- Pagination -->
        <div class="flex flex-col md:flex-row justify-between items-center mt-6 gap-4">
          <div id="recordInfo" class="text-gray-600 text-sm font-medium"></div>
          <div class="flex gap-2">
            <button id="prevBtn" class="px-4 py-2 bg-sky-600 text-white rounded-xl hover:bg-sky-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-300 flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
              </svg>
              Previous
            </button>
            <button id="nextBtn" class="px-4 py-2 bg-sky-600 text-white rounded-xl hover:bg-sky-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-300 flex items-center gap-2">
              Next
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    function logout(){
      const confirmed = confirm("Are you sure you want to log out?");
      if(confirmed){
        window.location.href="../../../index.html"
      }
    }
    // Tab functionality
    const scheduledTab = document.getElementById('scheduledTab');
    const historyTab = document.getElementById('historyTab');
    const scheduledContent = document.getElementById('scheduledContent');
    const historyContent = document.getElementById('historyContent');

    scheduledTab.addEventListener('click', () => {
      scheduledTab.className = 'flex-1 px-6 py-3 text-sm font-medium rounded-xl transition-all duration-300 bg-sky-600 text-white shadow-md';
      historyTab.className = 'flex-1 px-6 py-3 text-sm font-medium rounded-xl transition-all duration-300 text-gray-600 hover:bg-white/50 hover:text-gray-800';
      scheduledContent.classList.remove('hidden');
      historyContent.classList.add('hidden');
    });

    historyTab.addEventListener('click', () => {
      historyTab.className = 'flex-1 px-6 py-3 text-sm font-medium rounded-xl transition-all duration-300 bg-sky-600 text-white shadow-md';
      scheduledTab.className = 'flex-1 px-6 py-3 text-sm font-medium rounded-xl transition-all duration-300 text-gray-600 hover:bg-white/50 hover:text-gray-800';
      historyContent.classList.remove('hidden');
      scheduledContent.classList.add('hidden');
    });

    // Load appointments for current user
    function loadAppointmentsForCurrentUser() {
      const currentUser = localStorage.getItem('currentUser');
      const appointments = JSON.parse(localStorage.getItem('appointments')) || [];
      const doctors = JSON.parse(localStorage.getItem('doctors')) || [];
      const mine = appointments.filter(a => a.patientId === currentUser);
      renderScheduled(mine, doctors);
      // Map to history rows for the table
      const historyRows = mine.map(a => {
        const doc = doctors.find(d => d.doctorId === a.doctorId);
        return {
          id: a.appointmentId,
          doctor: doc ? doc.doctorName : a.doctorId,
          dept: doc ? (doc.department || '') : '',
          date: a.date,
          time: a.time
        };
      });
      return historyRows;
    }

    function renderScheduled(list, doctors) {
      const container = document.getElementById('scheduledList');
      container.innerHTML = '';
      if (list.length === 0) {
        container.innerHTML = '<p class="text-gray-500 text-center py-8 col-span-3">No scheduled appointments</p>';
        return;
      }
      list.forEach(appt => {
        const doc = doctors.find(d => d.doctorId === appt.doctorId);
        const card = document.createElement('div');
        card.className = 'bg-gradient-to-br from-white to-gray-50 rounded-2xl p-6 border border-gray-200 shadow-lg hover:shadow-xl transition-all duration-300';
        card.innerHTML = `
          <div class="flex items-center gap-4 mb-4">
            <div class="w-12 h-12 bg-gradient-to-br from-sky-200 to-sky-300 rounded-full flex items-center justify-center">
              <svg class="w-6 h-6 text-sky-600" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/>
              </svg>
            </div>
            <div>
              <p class="font-semibold text-gray-800">${doc ? doc.doctorName : appt.doctorId}</p>
              <p class="text-sm text-gray-600">${doc && doc.department ? doc.department : ''}</p>
            </div>
          </div>
          <div class="space-y-2 mb-4">
            <p class="text-sm text-gray-600">Appointment ID: <span class="font-medium">${appt.appointmentId}</span></p>
            <p class="text-sm text-gray-600">Date: <span class="font-medium">${appt.date}</span></p>
            <p class="text-sm text-gray-600">Time: <span class="font-medium">${appt.time}</span></p>
            <p class="text-sm text-gray-600">Status: <span class="font-medium">${appt.status}</span></p>
          </div>
          <div class="flex gap-2">
            <button class="flex-1 px-3 py-2 bg-sky-600 text-white text-sm rounded-lg hover:bg-sky-700 transition-all duration-300">Reschedule</button>
            <button class="flex-1 px-3 py-2 bg-red-500 text-white text-sm rounded-lg hover:bg-red-600 transition-all duration-300">Cancel</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    let filtered = [];
    const rowsPerPage = 8;
    let currentPage = 1;

    function renderTable() {
      const tbody = document.getElementById("historyTable");
      tbody.innerHTML = "";

      const start = (currentPage - 1) * rowsPerPage;
      const end = start + rowsPerPage;
      const pageData = filtered.slice(start, end);

      pageData.forEach(item => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-sky-50 transition-colors duration-300";
        tr.innerHTML = `
          <td class="px-6 py-3 font-medium text-sky-700">${item.id}</td>
          <td class="px-6 py-3">${item.doctor}</td>
          <td class="px-6 py-3">
            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800">${item.dept}</span>
          </td>
          <td class="px-6 py-3">${item.date}</td>
          <td class="px-6 py-3">${item.time}</td>
          <td class="px-6 py-3">
            <div class="flex justify-center gap-2">
              <button class="p-2 bg-sky-100 text-sky-600 rounded-lg hover:bg-sky-200 transition-colors duration-200" title="View">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                </svg>
              </button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });

      const startIdx = (currentPage - 1) * rowsPerPage + 1;
      const endIdx = Math.min(startIdx + rowsPerPage - 1, filtered.length);
      document.getElementById("recordInfo").textContent = `Showing ${startIdx}–${endIdx} of ${filtered.length} records`;
      document.getElementById("prevBtn").disabled = currentPage === 1;
      document.getElementById("nextBtn").disabled = endIdx >= filtered.length;
    }

    function applyFilters() {
      const term = document.getElementById("searchInput").value.toLowerCase();
      const dept = document.getElementById("departmentFilter").value;
      filtered = filtered.filter(r => (
        (!term || r.doctor.toLowerCase().includes(term) || r.id.toLowerCase().includes(term) || r.dept.toLowerCase().includes(term)) &&
        (!dept || r.dept === dept)
      ));
      currentPage = 1;
      renderTable();
    }

    function clearFilters() {
      document.getElementById("searchInput").value = "";
      document.getElementById("departmentFilter").value = "";
      filtered = loadAppointmentsForCurrentUser();
      currentPage = 1;
      renderTable();
    }
    // Event listeners for history tab
    document.getElementById("searchInput").addEventListener("input", applyFilters);
    document.getElementById("departmentFilter").addEventListener("change", applyFilters);
    document.getElementById("prevBtn").addEventListener("click", () => { if (currentPage > 1) { currentPage--; renderTable(); } });
    document.getElementById("nextBtn").addEventListener("click", () => { if ((currentPage * rowsPerPage) < filtered.length) { currentPage++; renderTable(); } });

    // Profile dropdown
    document.getElementById("profileButton").addEventListener("click", (e) => {
      e.stopPropagation();
      document.getElementById("profileDropdown").classList.toggle("hidden");
    });
    document.addEventListener("click", () => {
      document.getElementById("profileDropdown").classList.add("hidden");
    });
    // Initial load
    filtered = loadAppointmentsForCurrentUser();
    renderTable();
  </script>
</body>
</html>
