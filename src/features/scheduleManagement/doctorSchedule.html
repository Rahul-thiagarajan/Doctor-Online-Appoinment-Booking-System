<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GENCARE - Schedule</title>
  <link rel="icon" type="image/png" href="../../assets/logo/LogoSmall.png">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-sky-100 to-white min-h-screen font-poppins">
  <!-- Fixed Left Sidebar -->
  <div class="flex flex-col fixed left-0 top-0 h-full w-64 bg-gradient-to-b from-sky-700 via-sky-600 to-sky-800 shadow-xl z-50">
    <div class="px-6 py-3 border-b border-sky-500/30">
      <div class="flex items-center gap-3">
        <img src="../../assets/logo/LogoSmall.png" class="w-12 h-12">
        <h1 class="text-xl font-bold text-white">GENCARE</h1>
      </div>
    </div>
    <nav class="flex flex-col px-4 mt-1">
      <div onclick="window.location.href='../dashboard/doctorDashboard.html'" class="px-4 py-3 text-sky-100 rounded-xl hover:bg-white/20 hover:text-white hover:shadow-md transition-all duration-300 cursor-pointer font-medium flex items-center gap-3"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2-2z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5v4"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 5v4"/></svg>Dashboard</div>
      <div class="px-4 py-3 bg-white/20 text-white rounded-xl shadow-md backdrop-blur-sm font-medium flex items-center gap-3 cursor-pointer"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>Schedule Management</div>
      <div onclick="window.location.href='../appointmentBooking/doctorAppointment.html'" class="px-4 py-3 text-sky-100 rounded-xl hover:bg-white/20 hover:text-white hover:shadow-md transition-all duration-300 cursor-pointer font-medium flex items-center gap-3"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>Appointments</div>

      <div onclick="window.location.href='../reviews/doctorReview.html'" class="px-4 py-3 text-sky-100 rounded-xl hover:bg-white/20 hover:text-white hover:shadow-md transition-all duration-300 cursor-pointer font-medium flex items-center gap-3"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>Reviews</div>
      <div onclick="window.location.href='../report/doctorReport.html'" class="px-4 py-3 text-sky-100 rounded-xl hover:bg-white/20 hover:text-white hover:shadow-md transition-all duration-300 cursor-pointer font-medium flex items-center gap-3"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V5a2 2 0 012-2h6a2 2 0 012 2v14m-6 0H7a2 2 0 01-2-2v-5"/></svg>Report</div>
    </nav>
    <div class="absolute bottom-0 left-0 right-0 p-4 border-sky-500/30">
      <button class="flex gap-1 text-sky-100 items-center w-full px-6 py-2 rounded-xl hover:bg_white/20 hover:text-white hover:bg-white/20 my-2 hover:shadow-md transition-all duration-300 cursor-pointer"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>Help</button>
      <div class="relative">
        <div id="profileButton" class="w-full flex items-center gap-3 p-3 bg-white/20 rounded-xl backdrop-blur-sm cursor-pointer hover:bg-white/30 transition-all duration-300">
          <div class="w-10 h-10 bg-gradient-to-br from-gray-300 to-gray-400 rounded-full flex items-center justify-center">
            <svg class="w-6 h-6 text-gray-600" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/></svg>
          </div>
          <div class="text-white font-medium">Doctor</div>
          <svg class="w-4 h-4 text-white ml-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </div>
        
        <div id="profileDropdown" class="hidden absolute bottom-16 left-0 right-0 bg-white rounded-xl shadow-lg border border-gray-100 py-2 z-50">
          <button onclick="window.location.href='../profile/doctorProfile.html'" class="w-full px-4 py-2 text-left text-gray-800 hover:bg-gray-50 transition-colors duration-200 flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            Profile
          </button>
          <button onclick="logout()" class="w-full px-4 py-2 text-left text-red-600 hover:bg-red-50 transition-colors duration-200 flex items-center gap-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>Logout</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content shifted for sidebar -->
  <div class="ml-64">
  <section class="px-8 py-6">
    <div class="mb-2">
      <h2 class="text-3xl font-bold text-gray-800">Update Schedule</h2>
      <p class="text-gray-600">Create slots and manage availability</p>
    </div>
    <div class="bg-white/60 backdrop-blur-xl rounded-3xl shadow-xl border border-white/30 overflow-hidden">
      
      <!-- Header -->
      <div class="bg-gradient-to-r from-sky-600 to-blue-600 text-white p-6">
        <h1 class="text-2xl font-bold">Update Schedule</h1>
      </div>

      <div class="p-8 grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <!-- Left Side - Calendar -->
        <div class="space-y-6">
          <div>
            <h2 class="text-xl font-bold text-gray-800 mb-4">Select Date:</h2>
            
            <!-- Calendar Header -->
            <div class="bg-white rounded-2xl shadow-lg border border-gray-200 p-6">
              <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-semibold text-gray-800" id="currentMonth">September 2025</h3>
                <div class="flex gap-2">
                  <button id="prevMonth" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 hover:bg-sky-100 text-gray-600 hover:text-sky-600 transition-all duration-300">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                  </button>
                  <button id="nextMonth" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 hover:bg-sky-100 text-gray-600 hover:text-sky-600 transition-all duration-300">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                  </button>
                </div>
              </div>
              
              <!-- Calendar Grid -->
              <div class="grid grid-cols-7 gap-1 text-center">
                <!-- Day Headers -->
                <div class="text-xs font-medium text-red-500 py-2">Sun</div>
                <div class="text-xs font-medium text-gray-600 py-2">Mon</div>
                <div class="text-xs font-medium text-gray-600 py-2">Tue</div>
                <div class="text-xs font-medium text-gray-600 py-2">Wed</div>
                <div class="text-xs font-medium text-gray-600 py-2">Thu</div>
                <div class="text-xs font-medium text-gray-600 py-2">Fri</div>
                <div class="text-xs font-medium text-gray-600 py-2">Sat</div>
                
                <!-- Calendar Days -->
                <div id="calendarDays" class="contents">
                  <!-- Days will be generated by JavaScript -->
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Right Side - Create Slot -->
        <div class="space-y-6">
          <div>
            <h2 class="text-xl font-bold text-gray-800 mb-4">Create Slot:</h2>
            
            <div class="bg-white rounded-2xl shadow-lg border border-gray-200 p-6 space-y-4">
              
              <!-- Slot Start Time -->
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Slot start time:</label>
                <input type="time" id="slotStartTime" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition-all duration-300">
              </div>

              <!-- Slot Duration -->
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Slot duration:</label>
                <select id="slotDuration" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition-all duration-300">
                  <option value="15">15 minutes</option>
                  <option value="30" selected>30 minutes</option>
                  <option value="45">45 minutes</option>
                  <option value="60">60 minutes</option>
                </select>
              </div>

              <!-- Maximum Patients -->
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Maximum patients allowed:</label>
                <input type="number" id="maxPatients" min="1" max="10" value="1" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition-all duration-300">
              </div>

              <!-- Action Buttons -->
              <div class="flex gap-3 pt-4">
                <button id="resetBtn" class="px-6 py-3 bg-gray-800 text-white rounded-xl font-medium hover:bg-gray-700 transition-all duration-300 flex-1">Reset</button>
                <button id="createBtn" class="px-6 py-3 bg-gradient-to-r from-sky-600 to-blue-600 text-white rounded-xl font-medium hover:shadow-lg transform hover:scale-105 transition-all duration-300 flex-1">Create</button>
              </div>
            </div>
          </div>

          <!-- Slots Section -->
          <div>
            <h2 class="text-xl font-bold text-gray-800 mb-4">Slots:</h2>
            
            <div class="bg-white rounded-2xl shadow-lg border border-gray-200 p-6">
              <div id="selectedDateSlots" class="text-center py-8 text-gray-500">
                <svg class="w-12 h-12 text-gray-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
                <p>Select a date to view and manage slots</p>
              </div>
              
              <!-- Sample Slots (will be populated dynamically) -->
              <div id="slotsContainer" class="space-y-3 hidden">
                <!-- Slots will be added here dynamically -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  </div>

  <script>
    function logout(){
      const confirmed = confirm("Are you sure you want to log out?");
      if(confirmed){
        window.location.href="../../../index.html"
      }
    }
    // Profile dropdown functionality
    document.getElementById("profileButton").addEventListener("click", (e) => {
      e.stopPropagation();
      document.getElementById("profileDropdown").classList.toggle("hidden");
    });
    document.addEventListener("click", () => {
      document.getElementById("profileDropdown").classList.add("hidden");
    });

    // Calendar functionality
    let currentDate = new Date();
    let selectedDate = null;
    const currentUser = localStorage.getItem('currentUser');
    console.log('[Schedule] currentUser:', currentUser);
    const doctorsFromStorage = JSON.parse(localStorage.getItem('doctors')) || [];
    console.log('[Schedule] doctors in storage:', doctorsFromStorage);
    const loggedInDoctorIndex = doctorsFromStorage.findIndex(d => d.doctorId === currentUser);
    console.log('[Schedule] loggedInDoctorIndex:', loggedInDoctorIndex);
    const loggedInDoctor = loggedInDoctorIndex !== -1 ? doctorsFromStorage[loggedInDoctorIndex] : null;
    console.log('[Schedule] loggedInDoctor:', loggedInDoctor);
    let slots = {};
    if (loggedInDoctor && loggedInDoctor.slots != null) {
      if (Array.isArray(loggedInDoctor.slots)) {
        console.warn('[Schedule] Legacy slots detected as Array. Converting to Object.');
        slots = {};
        doctorsFromStorage[loggedInDoctorIndex] = {
          ...doctorsFromStorage[loggedInDoctorIndex],
          slots
        };
        localStorage.setItem('doctors', JSON.stringify(doctorsFromStorage));
      } else if (typeof loggedInDoctor.slots === 'object') {
        slots = loggedInDoctor.slots;
      }
    }
    console.log('[Schedule] initial slots (normalized):', slots);
    function saveSlots() {
      try {
        if (loggedInDoctorIndex === -1) {
          console.warn('[Schedule] No logged-in doctor found. Slots not persisted.');
          return;
        }
        // Ensure plain object structure
        const plainSlots = JSON.parse(JSON.stringify(slots));
        doctorsFromStorage[loggedInDoctorIndex] = {
          ...doctorsFromStorage[loggedInDoctorIndex],
          slots: plainSlots
        };
        console.log('[Schedule] Persisting slots for doctor', doctorsFromStorage[loggedInDoctorIndex].doctorId, plainSlots);
        localStorage.setItem('doctors', JSON.stringify(doctorsFromStorage));
        const verify = JSON.parse(localStorage.getItem('doctors')) || [];
        const verifyDoctor = verify.find(d => d.doctorId === currentUser);
        console.log('[Schedule] localStorage.doctors updated. Verify slots:', verifyDoctor && verifyDoctor.slots);
      } catch (err) {
        console.error('[Schedule] Error persisting slots:', err);
      }
    }

    const monthNames = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"
    ];

    function generateCalendar() {
      const firstDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
      const lastDay = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0);
      const startDate = new Date(firstDay);
      startDate.setDate(startDate.getDate() - firstDay.getDay());

      const currentMonthElement = document.getElementById('currentMonth');
      currentMonthElement.textContent = `${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`;

      const calendarDays = document.getElementById('calendarDays');
      calendarDays.innerHTML = '';

      for (let i = 0; i < 42; i++) {
        const date = new Date(startDate);
        date.setDate(startDate.getDate() + i);
        
        const dayElement = document.createElement('div');
        dayElement.className = 'w-10 h-10 flex items-center justify-center text-sm rounded-lg cursor-pointer transition-all duration-300';
        
        if (date.getMonth() !== currentDate.getMonth()) {
          dayElement.className += ' text-gray-300';
        } else if (date < new Date().setHours(0,0,0,0)) {
          dayElement.className += ' text-gray-400 cursor-not-allowed';
        } else {
          dayElement.className += ' text-gray-700 hover:bg-sky-100 hover:text-sky-700';
        }

        // Check if this date is selected
        if (selectedDate && 
            date.getDate() === selectedDate.getDate() && 
            date.getMonth() === selectedDate.getMonth() && 
            date.getFullYear() === selectedDate.getFullYear()) {
          dayElement.className += ' bg-sky-600 text-white hover:bg-sky-700';
        }

        // Check if this date has slots
        const dateKey = `${date.getFullYear()}-${(date.getMonth() + 1).toString().padStart(2, '0')}-${date.getDate().toString().padStart(2, '0')}`;
        if (slots[dateKey] && slots[dateKey].length > 0) {
          dayElement.style.position = 'relative';
          const indicator = document.createElement('div');
          indicator.className = 'absolute bottom-0 right-0 w-2 h-2 bg-green-500 rounded-full';
          dayElement.appendChild(indicator);
        }
        dayElement.textContent = date.getDate();
        
        if (date.getMonth() === currentDate.getMonth() && date >= new Date().setHours(0,0,0,0)) {
          dayElement.addEventListener('click', () => selectDate(date));
        }
        calendarDays.appendChild(dayElement);
      }
    }

    function selectDate(date) {
      selectedDate = new Date(date);
      console.log('[Schedule] selectDate ->', selectedDate);
      generateCalendar();
      displaySlotsForDate(date);
    }

    function displaySlotsForDate(date) {
      const dateKey = `${date.getFullYear()}-${(date.getMonth() + 1).toString().padStart(2, '0')}-${date.getDate().toString().padStart(2, '0')}`;
      console.log('[Schedule] displaySlotsForDate dateKey:', dateKey, 'slots:', slots[dateKey]);
      const slotsContainer = document.getElementById('slotsContainer');
      const selectedDateSlots = document.getElementById('selectedDateSlots');
      
      if (slots[dateKey] && slots[dateKey].length > 0) {
        selectedDateSlots.classList.add('hidden');
        slotsContainer.classList.remove('hidden');
        slotsContainer.innerHTML = '';
        
        slots[dateKey].forEach((slot, index) => {
          const slotElement = createSlotElement(slot, dateKey, index);
          slotsContainer.appendChild(slotElement);
        });
      } else {
        selectedDateSlots.classList.remove('hidden');
        slotsContainer.classList.add('hidden');
        selectedDateSlots.innerHTML = `
          <svg class="w-12 h-12 text-gray-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <p>No slots available for ${date.toLocaleDateString()}</p>
        `;
      }
    }

    function createSlotElement(slot, dateKey, index) {
      const slotDiv = document.createElement('div');
      slotDiv.className = 'flex items-center justify-between p-4 bg-gradient-to-r from-sky-50 to-blue-50 rounded-xl border border-sky-200';
      
      slotDiv.innerHTML = `
        <div class="flex items-center gap-4">
          <div class="w-3 h-3 bg-green-500 rounded-full"></div>
          <div>
            <p class="font-medium text-gray-800">${slot.startTime} - ${slot.endTime}</p>
            <p class="text-sm text-gray-600">${slot.duration} min • Max: ${slot.maxPatients} patients</p>
          </div>
        </div>
        <button onclick="removeSlot('${dateKey}', ${index})" class="w-8 h-8 bg-red-100 text-red-600 rounded-full hover:bg-red-200 transition-all duration-300 flex items-center justify-center">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
        </button>
      `;
      
      return slotDiv;
    }

    function removeSlot(dateKey, index) {
      console.log('[Schedule] removeSlot called ->', { dateKey, index, current: slots[dateKey] });
      if (confirm('Are you sure you want to remove this slot?')) {
        slots[dateKey].splice(index, 1);
        if (slots[dateKey].length === 0) {
          delete slots[dateKey];
        }
        // Persist after deletion
        saveSlots();
        console.log('[Schedule] slot removed. New slots for date:', slots[dateKey]);
        generateCalendar();
        if (selectedDate) {
          displaySlotsForDate(selectedDate);
        }
      }
    }

    function calculateEndTime(startTime, duration) {
      const [hours, minutes] = startTime.split(':').map(Number);
      const totalMinutes = hours * 60 + minutes + parseInt(duration);
      const endHours = Math.floor(totalMinutes / 60) % 24;
      const endMinutes = totalMinutes % 60;
      return `${endHours.toString().padStart(2, '0')}:${endMinutes.toString().padStart(2, '0')}`;
    }

    // Event listeners
    document.getElementById('prevMonth').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      generateCalendar();
    });

    document.getElementById('nextMonth').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      generateCalendar();
    });

    document.getElementById('createBtn').addEventListener('click', () => {
      if (!selectedDate) {
        alert('Please select a date first');
        return;
      }

      const startTime = document.getElementById('slotStartTime').value;
      const duration = document.getElementById('slotDuration').value;
      const maxPatients = document.getElementById('maxPatients').value;
      console.log('[Schedule] Create clicked with:', { selectedDate, startTime, duration, maxPatients });

      if (!startTime) {
        alert('Please select a start time');
        return;
      }

      const dateKey = `${selectedDate.getFullYear()}-${(selectedDate.getMonth() + 1).toString().padStart(2, '0')}-${selectedDate.getDate().toString().padStart(2, '0')}`;
      
      if (!slots[dateKey]) {
        slots[dateKey] = [];
      }

      const endTime = calculateEndTime(startTime, duration);
      console.log('[Schedule] Calculated endTime:', endTime);
      
      const newSlot = {
        startTime,
        endTime,
        duration: parseInt(duration),
        maxPatients: parseInt(maxPatients)
      };

      slots[dateKey].push(newSlot);
      console.log('[Schedule] Slot added. New slots for date:', dateKey, slots[dateKey]);
      // Persist after creation
      saveSlots();
      generateCalendar();
      displaySlotsForDate(selectedDate);
      
      // Show success message
      const createBtn = document.getElementById('createBtn');
      const originalText = createBtn.textContent;
      createBtn.textContent = 'Created!';
      createBtn.className = createBtn.className.replace('from-sky-600 to-blue-600', 'from-green-600 to-green-600');
      
      setTimeout(() => {
        createBtn.textContent = originalText;
        createBtn.className = createBtn.className.replace('from-green-600 to-green-600', 'from-sky-600 to-blue-600');
      }, 2000);
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      document.getElementById('slotStartTime').value = '';
      document.getElementById('slotDuration').value = '30';
      document.getElementById('maxPatients').value = '1';
    });

    // Make removeSlot function global
    window.removeSlot = removeSlot;

    // Initialize calendar with persisted slots (if any)
    generateCalendar();
  </script>
</body>
</html>
