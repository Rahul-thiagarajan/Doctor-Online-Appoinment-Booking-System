<!DOCTYPE html>
<html lang="en">
<head>

  <title>GENCARE - Profile</title>
  <link rel="icon" type="image/png" href="../../assets/logo/LogoSmall.png">

</head>
<body class="bg-gradient-to-br from-sky-100 to-white min-h-screen">
  
  <!-- Fixed Left Sidebar -->
  <div class="flex flex-col fixed left-0 top-0 h-full w-64 bg-gradient-to-b from-sky-700 via-sky-600 to-sky-800 shadow-xl z-50">
    <!-- Logo Section -->
    <div class="px-6 py-3 border-b border-sky-500/30">
      <div class="flex items-center gap-3">
        <img src="../../assets/logo/LogoSmall.png" alt="Logo" class="h-12 w-12 object-contain">
        <h1 class="text-xl font-bold text-white">GENCARE</h1>
      </div>
    </div>
    
    <div>
    <!-- Navigation Links -->
    <nav class="flex flex-col px-4">
      <div onclick="window.location.href=`../dashboard/adminDashboard.html`" class="px-4 py-3 text-sky-100 rounded-xl hover:bg-white/20 hover:text-white hover:shadow-md transition-all duration-300 cursor-pointer font-medium flex items-center gap-3">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2-2z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5v4"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 5v4"></path>
        </svg>
        Dashboard
      </div>

      <div onclick="window.location.href=`../doctors/adminDoctors.html`" class="px-4 py-3 text-sky-100 rounded-xl hover:bg-white/20 hover:text-white hover:shadow-md transition-all duration-300 cursor-pointer font-medium flex items-center gap-3">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <!-- Earpieces -->
            <circle cx="6" cy="4" r="2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="18" cy="4" r="2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Tubes -->
            <path d="M6 6v5a6 4 0 0012 0V6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Tube going down -->

            <!-- Chest piece -->
            <circle cx="18" cy="19" r="2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>

      </div>
      
      <div onclick="window.location.href=`../appointmentBooking/adminPatients.html`" class="px-4 py-3 text-sky-100  font-medium flex items-center gap-3 cursor-pointer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
        </svg>
        Patients
      </div>
      
      <div onclick="window.location.href=`../contentManagement/adminContent.html`" class="px-4 py-3 text-sky-100 rounded-xl hover:bg-white/20 hover:text-white hover:shadow-md transition-all duration-300 cursor-pointer font-medium flex items-center gap-3">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
        Content Management
      </div>
      
      <div onclick="window.location.href=`../report/adminReport.html`" class="px-4 py-3 text-sky-100 rounded-xl hover:bg-white/20 hover:text-white hover:shadow-md transition-all duration-300 cursor-pointer font-medium flex items-center gap-3">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
        </svg>
        Reports
      </div>
      
      <div onclick="window.location.href=`../backupRecovery/adminBackup.html`" class="px-4 py-3 text-sky-100 rounded-xl hover:bg-white/20 hover:text-white hover:shadow-md transition-all duration-300 cursor-pointer font-medium flex items-center gap-3">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4"></path>
        </svg>
        Backup & Recovery
      </div>
      
      <div onclick="window.location.href=`../Queries/adminQueries.html`" class="px-4 py-3 text-sky-100 rounded-xl hover:bg-white/20 hover:text-white hover:shadow-md transition-all duration-300 cursor-pointer font-medium flex items-center gap-3">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        Queries
      </div>
    </nav>
  </div>
    
    <!-- Profile Section at Bottom -->
    <div class="absolute bottom-0 left-0 right-0 p-4 border-sky-500/30">
		<button class="flex gap-1 text-sky-100 items-center w-full px-6 py-2 rounded-xl hover:bg_white/20 hover:text-white hover:bg-white/20 my-2 hover:shadow-md transition-all duration-300 cursor-pointer">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            Help
          </button>
      <div class="relative">
        <div id="profileButton" class="w-full flex items-center gap-3 p-3 bg-white/20 rounded-xl backdrop-blur-sm cursor-pointer hover:bg-white/30 transition-all duration-300">
          <div class="w-10 h-10 bg-gradient-to-br from-gray-300 to-gray-400 rounded-full flex items-center justify-center">
            <img src="../../assets/images/profile.png" class="w-6 h-6" alt="Profile">
          </div>
          <div class="text-white font-medium">Admin</div>
          <svg class="w-4 h-4 text-white ml-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
        </div>
        
        <div id="profileDropdown" class="hidden absolute bottom-16 left-0 right-0 bg-white rounded-xl shadow-lg border border-gray-100 py-2 z-50">
          <button class="w-full px-4 py-2 text-left text-gray-800 hover:bg-gray-50 transition-colors duration-200 flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
            Profile
          </button>
          
          <button onclick="logout()" class="w-full px-4 py-2 text-left text-red-600 hover:bg-red-50 transition-colors duration-200 flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
            </svg>
            Logout
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content Area (shifted right to accommodate sidebar) -->
	<div class="ml-64">
	  <!-- Header -->
	  <section class="p-8 pt-6">
	    <div class="mb-2">
	      <h1 class="text-3xl font-bold text-gray-800 mb-1">Admin Profile</h1>
	      <p class="text-gray-600">View and edit your personal information</p>
	    </div>
	  </section>

	  <!-- Content -->
	  <section class="px-8 pb-10 space-y-8">
	    <!-- Top: Profile Photo + Name -->
	    <div class="bg-white/70 backdrop-blur-xl rounded-3xl shadow-xl border border-white/30 px-8 py-6 flex items-center justify-between bg-gradient-to-tl from-sky-100 to-white">
	      <div class="flex items-center gap-6">
	        <div class="relative">
	          <div class="w-28 h-28 bg-gradient-to-br from-gray-200 to-gray-300 rounded-full flex items-center justify-center shadow-inner overflow-hidden">
	            <img id="adminAvatar" src="../../assets/images/profile.png" alt="Admin" class="w-full h-full object-cover">
	          </div>
	        </div>
	        <div>
	          <h2 class="text-2xl font-bold text-gray-800" id="adminNameHeading">Admin</h2>
	          <p class="text-gray-600" id="adminEmailText">admin@example.com</p>
	        </div>
	      </div>
	      <div class="flex items-center gap-3">
			<button class="px-6 py-2.5 bg-gradient-to-r from-sky-600 to-sky-700 text-white rounded-xl hover:from-sky-700 hover:to-sky-800 transition-all duration-300 shadow-md hover:shadow-lg flex items-center gap-2">
			<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
			Edit
			</button>
	        <label for="photoInput" class="px-5 py-2.5 bg-gradient-to-r from-sky-600 to-sky-700 text-white rounded-xl cursor-pointer hover:from-sky-700 hover:to-sky-800 transition-all duration-300 shadow-md hover:shadow-lg flex items-center gap-2">
	          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v12m6-6H6"/></svg>
	          Upload Photo
	        </label>
	        <input id="photoInput" type="file" accept="image/*" class="hidden">
	      </div>
	    </div>

	    <!-- Personal Details -->
	    <div class="bg-gradient-to-br from-white to-gray-50 rounded-3xl p-8 shadow-xl border border-gray-200">
	      <h3 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2">
	        <div class="w-6 h-6 bg-gradient-to-r from-sky-500 to-sky-600 rounded-lg flex items-center justify-center">
	          <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
	        </div>
	        Personal Details
	      </h3>
	      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
	        <div>
	          <label class="block text-gray-700 font-medium mb-1 text-sm">Full Name</label>
	          <input disabled id="adminName" type="text" class="w-full p-3 border border-gray-300 rounded-xl bg-white focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all duration-300" value="Admin">
	        </div>
	        <div>
	          <label class="block text-gray-700 font-medium mb-1 text-sm">Email</label>
	          <input id="adminEmail" type="email" class="w-full p-3 border border-gray-300 rounded-xl bg-white focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all duration-300" value="admin@example.com">
	        </div>
	        <div>
	          <label class="block text-gray-700 font-medium mb-1 text-sm">New Password</label>
	          <input id="adminPassword" type="password" placeholder="••••••••" class="w-full p-3 border border-gray-300 rounded-xl bg-white focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all duration-300">
	        </div>
	        <div>
	          <label class="block text-gray-700 font-medium mb-1 text-sm">Confirm Password</label>
	          <input disabled id="adminPasswordConfirm" type="password" placeholder="••••••••" class="w-full p-3 border border-gray-300 rounded-xl bg-white focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all duration-300">
	        </div>
	      </div>
	      <div class="flex justify-end pt-6">
	        <button id="savePersonal" class="px-7 py-3 bg-gradient-to-r from-sky-600 to-blue-600 text-white rounded-xl font-semibold shadow-lg hover:shadow-xl hover:from-sky-700 hover:to-blue-700 transition-all duration-300">Save Personal</button>
	      </div>
	    </div>

	    <!-- Basic Details -->
	    <div class="bg-gradient-to-br from-white to-gray-50 rounded-3xl p-8 shadow-xl border border-gray-200">
	      <h3 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2">
	        <div class="w-6 h-6 bg-gradient-to-r from-green-500 to-emerald-600 rounded-lg flex items-center justify-center">
	          <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
	        </div>
	        Basic Details
	      </h3>
	      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
	        <div>
	          <label class="block text-gray-700 font-medium mb-1 text-sm">Date of Birth</label>
	          <input disabled id="adminDob" type="date" class="w-full p-3 border border-gray-300 rounded-xl bg-white focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all duration-300">
	        </div>
	        <div>
	          <label class="block text-gray-700 font-medium mb-1 text-sm">Phone Number</label>
	          <input disabled id="adminPhone" type="tel" placeholder="+91 9876543210" class="w-full p-3 border border-gray-300 rounded-xl bg-white focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all duration-300">
	        </div>
	      </div>
	      <div class="flex justify-end pt-6">
	        <button id="saveBasic" class="px-7 py-3 bg-gradient-to-r from-sky-600 to-blue-600 text-white rounded-xl font-semibold shadow-lg hover:shadow-xl hover:from-sky-700 hover:to-blue-700 transition-all duration-300">Save Basic</button>
	      </div>
	    </div>

	  </section>
	</div>
	<script>
		function logout(){
      const confirmed = confirm("Are you sure you want to log out?");
      if(confirmed){
        window.location.href="../../../index.html"
      }
    }
	  // Profile dropdown
	  document.getElementById('profileButton')?.addEventListener('click', (e) => {
	    e.stopPropagation();
	    document.getElementById('profileDropdown')?.classList.toggle('hidden');
	  });
	  document.addEventListener('click', () => {
	    document.getElementById('profileDropdown')?.classList.add('hidden');
	  });

	  // Photo upload preview
	  const photoInput = document.getElementById('photoInput');
	  const avatar = document.getElementById('adminAvatar');
	  photoInput?.addEventListener('change', (e) => {
	    const file = e.target.files?.[0];
	    if (!file) return;
	    const reader = new FileReader();
	    reader.onload = (ev) => {
	      avatar.src = ev.target?.result;
	    };
	    reader.readAsDataURL(file);
	  });

	  // Reflect heading/email when saving personal
	  document.getElementById('savePersonal')?.addEventListener('click', () => {
	    const nameInput = document.getElementById('adminName');
	    const emailInput = document.getElementById('adminEmail');
	    const name = nameInput && 'value' in nameInput ? nameInput.value : '';
	    const email = emailInput && 'value' in emailInput ? emailInput.value : '';
	    const nameEl = document.getElementById('adminNameHeading');
	    const emailEl = document.getElementById('adminEmailText');
	    if (nameEl) nameEl.textContent = name || 'Admin';
	    if (emailEl) emailEl.textContent = email || 'admin@example.com';
	  });
	</script>
  </body>
</html>
